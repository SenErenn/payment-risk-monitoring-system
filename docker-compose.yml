services:
  postgres:
    image: postgres:17-alpine
    container_name: payment-risk-monitoring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-payment_risk_monitoring}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-payscope} -d ${POSTGRES_DB:-payment_risk_monitoring}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend/PaymentRiskMonitoring.Api
      dockerfile: Dockerfile
    container_name: payment-risk-monitoring-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-payment_risk_monitoring};Username=${POSTGRES_USER:-payscope};Password=${POSTGRES_PASSWORD:-change_me}
      Jwt__Secret: ${Jwt__Secret:-change_me_to_a_long_random_secret_at_least_32_chars}
      Jwt__Issuer: ${Jwt__Issuer:-PaymentRiskMonitoring}
      Jwt__Audience: ${Jwt__Audience:-PaymentRiskMonitoring}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes:-60}
      Database__MigrateOnStartup: ${Database__MigrateOnStartup:-true}
      Database__SeedOnStartup: ${Database__SeedOnStartup:-true}
      Cors__Origins__0: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "${API_PORT:-5067}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5067}
    container_name: payment-risk-monitoring-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres-data:
